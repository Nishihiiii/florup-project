services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${API_IMAGE:-florup-api:local}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_ORIGIN: https://florup.localhost
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - florup-internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-florup-frontend:local}
    expose:
      - "8080"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - florup-internal

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - api
    ports:
    - "127.0.0.1:8080:80"
    - "127.0.0.1:443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
      - florup-internal

networks:
  florup-internal:
    driver: bridge
