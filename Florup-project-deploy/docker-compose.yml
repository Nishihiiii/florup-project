services:
  api:
    build:
      context: ../Florup-project/backend
      dockerfile: Dockerfile
    image: ${API_IMAGE:-florup-api:local}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_ORIGIN: https://florup.localhost
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - florup-internal

  frontend:
    build:
      context: ../Florup-project/frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-florup-frontend:local}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - florup-internal

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - api
    ports:
      - '127.0.0.1:80:80'
      - '127.0.0.1:443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
      - florup-internal

networks:
  florup-internal:
    driver: bridge