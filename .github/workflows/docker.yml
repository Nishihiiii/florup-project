name: Docker build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Собрать Docker-образ backend
        run: docker build -t florup-api:ci ./backend

      - name: Собрать Docker-образ frontend
        run: docker build -t florup-frontend:ci ./frontend