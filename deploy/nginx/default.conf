server {
    listen 80;
    server_name florup.localhost localhost;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name florup.localhost localhost;
    ssl_certificate /etc/nginx/certs/florup.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/florup.localhost-key.pem;
    location /api/ {
        proxy_pass http://api:3000;
    }
    location / {
        proxy_pass http://frontend:8080;
    }
}
